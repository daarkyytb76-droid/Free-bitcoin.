<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pomnub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      position: fixed;
      top: 0;
      left: 0;
    }
    .bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      object-position: center;
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <img class="bg" src="1000321982.jpg" alt="">
  <audio id="audio" src="audio_max_volume.m4a" loop preload="auto" autoplay playsinline></audio>
  <script>
    const audio = document.getElementById('audio');
    audio.volume = 1.0;
    audio.muted = false;

    function playLoud() {
      audio.volume = 1.0;
      audio.muted = false;
      return audio.play();
    }

    // Tentatives agressives dès le chargement
    playLoud().catch(() => {});

    // Dès que le fichier audio est prêt
    audio.addEventListener('canplaythrough', () => {
      playLoud().catch(() => {});
    });
    audio.addEventListener('loadeddata', () => {
      playLoud().catch(() => {});
    });

    // Plusieurs essais rapides au démarrage
    let tries = 0;
    const interval = setInterval(() => {
      tries++;
      playLoud().then(() => {
        clearInterval(interval);
      }).catch(() => {});
      if (tries > 20) clearInterval(interval);
    }, 100);

    window.addEventListener('load', () => playLoud().catch(() => {}));
    document.addEventListener('DOMContentLoaded', () => playLoud().catch(() => {}));

    // Plein écran
    function goFullscreen() {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.msRequestFullscreen) el.msRequestFullscreen();
    }
    goFullscreen();
  </script>
</body>
</html>
